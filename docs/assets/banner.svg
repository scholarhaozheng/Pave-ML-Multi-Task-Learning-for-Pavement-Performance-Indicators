<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">Pave-ML: three-stage multi-task learning</title>
  <desc id="description">M1 trains the shared Dense representation and IRI branch. M2 inherits those weights, freezes the shared and IRI layers, and trains an RD branch. M3 inherits M2, adds PCI, and fine-tunes the shared representation and all three branches. Dashed arrows between stages denote weight transfer. Each task branch uses Conv1D, an LSTM, GRU or TCN temporal model, and a Dense output.</desc>
  <defs>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b5563"/></marker>
    <marker id="transfer" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#416885"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202a35; }
      .trainable { fill: #eaf2f8; stroke: #416885; stroke-width: 1.6; }
      .frozen { fill: #f3f4f5; stroke: #828b94; stroke-width: 1.6; stroke-dasharray: 5 3; }
      .flow { fill: none; stroke: #4b5563; stroke-width: 1.6; marker-end: url(#flow); }
      .branch { font-size: 19px; font-weight: 600; text-anchor: middle; }
      .state { font-size: 15px; text-anchor: middle; fill: #536170; }
      .note { font-size: 17px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1440" height="560" fill="#ffffff"/>
  <text x="36" y="44" font-size="27" font-weight="600">Three-stage multi-task learning</text>
  <rect class="trainable" x="902" y="25" width="22" height="18" rx="2"/>
  <text x="934" y="40" font-size="16">Trainable</text>
  <rect class="frozen" x="1032" y="25" width="22" height="18" rx="2"/>
  <text x="1064" y="40" font-size="16">Frozen</text>
  <path d="M1168 34H1213" fill="none" stroke="#416885" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#transfer)"/>
  <text x="1226" y="40" font-size="16">Weight transfer</text>
  <path d="M36 70H1404" stroke="#cfd6dd"/>

  <text x="36" y="117" font-size="29" font-weight="700">M1</text>
  <text x="99" y="115" font-size="22">IRI pretraining</text>
  <text x="512" y="117" font-size="29" font-weight="700">M2</text>
  <text x="575" y="115" font-size="22">RD transfer</text>
  <text x="988" y="117" font-size="29" font-weight="700">M3</text>
  <text x="1051" y="115" font-size="22">Joint fine-tuning</text>

  <g fill="#ffffff" stroke="#cfd6dd" stroke-width="1.2">
    <rect x="36" y="142" width="412" height="308" rx="3"/>
    <rect x="512" y="142" width="412" height="308" rx="3"/>
    <rect x="988" y="142" width="416" height="308" rx="3"/>
  </g>
  <g font-size="18" text-anchor="middle">
    <text x="242" y="178">Historical observations</text>
    <text x="718" y="178">Historical observations</text>
    <text x="1196" y="178">Historical observations</text>
  </g>
  <path class="flow" d="M242 187V210"/>
  <path class="flow" d="M718 187V210"/>
  <path class="flow" d="M1196 187V210"/>

  <rect class="trainable" x="72" y="218" width="340" height="62" rx="3"/>
  <rect class="frozen" x="548" y="218" width="340" height="62" rx="3"/>
  <rect class="trainable" x="1024" y="218" width="344" height="62" rx="3"/>
  <g font-size="21" font-weight="600" text-anchor="middle">
    <text x="242" y="245">Shared representation</text>
    <text x="718" y="245">Shared representation</text>
    <text x="1196" y="245">Shared representation</text>
  </g>
  <g class="state">
    <text x="242" y="267">Dense layers · trainable</text>
    <text x="718" y="267">Dense layers · frozen</text>
    <text x="1196" y="267">Dense layers · trainable</text>
  </g>
  <g fill="none" stroke="#416885" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#transfer)">
    <path d="M454 250H506"/>
    <path d="M930 250H982"/>
  </g>
  <g font-size="12" fill="#416885" text-anchor="middle">
    <text x="480" y="236">weights</text>
    <text x="956" y="236">weights</text>
  </g>

  <path class="flow" d="M242 280V323"/>
  <path d="M718 280V301H624M718 301H812" fill="none" stroke="#4b5563" stroke-width="1.6"/>
  <path class="flow" d="M624 301V323"/>
  <path class="flow" d="M812 301V323"/>
  <path d="M1196 280V301M1064 301H1328" fill="none" stroke="#4b5563" stroke-width="1.6"/>
  <path class="flow" d="M1064 301V323"/>
  <path class="flow" d="M1196 301V323"/>
  <path class="flow" d="M1328 301V323"/>

  <rect class="trainable" x="152" y="330" width="180" height="68" rx="3"/>
  <text class="branch" x="242" y="359">IRI branch</text>
  <text class="state" x="242" y="383">Trainable</text>

  <rect class="frozen" x="542" y="330" width="164" height="68" rx="3"/>
  <text class="branch" x="624" y="359">IRI branch</text>
  <text class="state" x="624" y="383">Frozen</text>
  <rect class="trainable" x="730" y="330" width="164" height="68" rx="3"/>
  <text class="branch" x="812" y="359">RD branch</text>
  <text class="state" x="812" y="383">Trainable</text>

  <rect class="trainable" x="1005" y="330" width="118" height="68" rx="3"/>
  <text class="branch" x="1064" y="359">IRI</text>
  <text class="state" x="1064" y="383">Trainable</text>
  <rect class="trainable" x="1137" y="330" width="118" height="68" rx="3"/>
  <text class="branch" x="1196" y="359">RD</text>
  <text class="state" x="1196" y="383">Trainable</text>
  <rect class="trainable" x="1269" y="330" width="118" height="68" rx="3"/>
  <text class="branch" x="1328" y="359">PCI</text>
  <text class="state" x="1328" y="383">Trainable</text>

  <text class="note" x="242" y="430">Learn shared features and IRI prediction</text>
  <text class="note" x="718" y="430">Retain IRI; learn the RD branch</text>
  <text class="note" x="1196" y="430">Jointly update all three task branches</text>
  <path d="M36 480H1404" stroke="#cfd6dd"/>
  <text x="36" y="516" font-size="18" font-weight="600">Task branch</text>
  <text x="164" y="516" font-size="18">Conv1D → LSTM / GRU / TCN → Dense output</text>
  <text x="1404" y="516" font-size="16" text-anchor="end" fill="#536170">Inputs: features + available indicator histories</text>
</svg>
